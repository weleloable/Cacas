name: Supabase Keep-Alive

# Supabase pausa los proyectos gratuitos tras ~7 días sin actividad.
# Este workflow hace una petición de lectura mínima cada 3 días para
# que el proyecto se considere "activo" y no se pause nunca.

on:
  schedule:
    - cron: "0 6 */3 * *"  # Cada 3 días a las 06:00 UTC
  workflow_dispatch: {}     # Permite lanzarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lectura mínima a la tabla viajes)
        run: |
          curl --fail --silent --show-error \
            "${SUPABASE_URL}/rest/v1/viajes?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
